<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos | Painel Mushy Perfume</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body page-loaded">

<aside class="admin-sidebar">
  <a href="index.html" class="logo">Mushy<span>Admin</span></a>
  <p class="admin-eyebrow">Painel administrativo</p>
  <nav class="admin-nav">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Visão geral</a>
    <a href="produtos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.5 7.5 12 3 3.5 7.5 12 12l8.5-4.5z"/><path d="M3.5 7.5v9L12 21l8.5-4.5v-9"/><path d="M12 12v9"/></svg> Produtos</a>
    <a href="pedidos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg> Pedidos</a>
    <a href="assinaturas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6 8 7 8-7"/></svg> Assinaturas</a>
  </nav>
  <div class="admin-user">
    <div class="admin-user-email" data-admin-email></div>
    <button class="admin-logout" data-admin-logout>Sair</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h1>Produtos</h1>
      <p>Adicione, edite ou remova perfumes do catálogo</p>
    </div>
    <button class="btn-admin" id="newProductBtn">+ Novo produto</button>
  </div>

  <div id="productsAlert"></div>

  <div class="admin-panel">
    <div class="admin-panel-head">
      <h2>Catálogo</h2>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table" id="productsTable">
        <thead>
          <tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Desconto</th><th>Estoque</th><th>Status</th><th></th></tr>
        </thead>
        <tbody><tr><td colspan="8" class="admin-empty">Carregando…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <h2 id="productModalTitle">Novo produto</h2>
    <div id="productFormAlert"></div>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="form-grid">
        <div class="form-field span-2">
          <label for="name">Nome</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-field">
          <label for="category">Categoria</label>
          <select id="category" required>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="unissex">Unissex</option>
          </select>
        </div>
        <div class="form-field">
          <label for="tone">Cor de fundo (sem foto)</label>
          <select id="tone">
            <option value="tone-1">Tone 1</option>
            <option value="tone-2">Tone 2</option>
            <option value="tone-3">Tone 3</option>
            <option value="tone-4">Tone 4</option>
            <option value="tone-5">Tone 5</option>
            <option value="tone-6">Tone 6</option>
          </select>
        </div>
        <div class="form-field span-2">
          <label for="notes">Notas olfativas</label>
          <input type="text" id="notes" placeholder="Âmbar, couro e baunilha">
        </div>
        <div class="form-field span-2">
          <label for="image">Caminho da imagem</label>
          <input type="text" id="image" placeholder="img/nome-do-perfume.png">
        </div>
        <div class="form-field">
          <label for="price">Preço (Kz)</label>
          <input type="number" id="price" min="0" step="0.01" required>
        </div>
        <div class="form-field">
          <label for="discount_percent">Desconto (%)</label>
          <input type="number" id="discount_percent" min="0" max="100" step="1" value="0">
        </div>
        <div class="form-field">
          <label for="stock">Estoque</label>
          <input type="number" id="stock" min="0" step="1" value="0">
        </div>
        <div class="form-field span-2">
          <label for="description">Descrição (opcional)</label>
          <textarea id="description"></textarea>
        </div>
        <div class="form-field form-checkbox">
          <input type="checkbox" id="active" checked>
          <label for="active">Visível na loja</label>
        </div>
        <div class="form-field form-checkbox">
          <input type="checkbox" id="featured">
          <label for="featured">Coleção assinatura</label>
        </div>
        <div class="form-field form-checkbox">
          <input type="checkbox" id="bestseller">
          <label for="bestseller">Mais vendido</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-admin btn-admin-outline" id="cancelProductBtn">Cancelar</button>
        <button type="submit" class="btn-admin" id="saveProductBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/produtos.js"></script>
</body>
</html>
