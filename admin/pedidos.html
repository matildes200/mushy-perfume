<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h1>Pedidos</h1>
      <p>Validação de comprovativos e acompanhamento das encomendas</p>
    </div>
  </div>

  <div id="ordersAlert"></div>

  <div class="admin-panel">
    <div class="admin-filters">
      <div class="filter-field">
        <label for="filterStatus">Estado</label>
        <select id="filterStatus"><option value="">Todos os estados</option></select>
      </div>
      <div class="filter-field">
        <label for="filterFrom">De</label>
        <input type="date" id="filterFrom">
      </div>
      <div class="filter-field">
        <label for="filterTo">Até</label>
        <input type="date" id="filterTo">
      </div>
      <div class="filter-field filter-grow">
        <label for="filterSearch">Pesquisar</label>
        <input type="search" id="filterSearch" placeholder="Número do pedido ou nome do cliente">
      </div>
      <div class="filter-actions">
        <button type="button" class="btn-admin" id="applyFiltersBtn">Filtrar</button>
        <button type="button" class="btn-admin btn-admin-outline" id="clearFiltersBtn">Limpar</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="ordersTable">
        <thead>
          <tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Total</th><th>Pagamento</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody><tr><td colspan="7" class="admin-empty">A carregar…</td></tr></tbody>
      </table>
    </div>

    <div class="admin-pagination" id="ordersPagination">
      <span class="pagination-info" id="paginationInfo"></span>
      <div class="pagination-controls">
        <button type="button" class="btn-admin btn-admin-outline" id="prevPageBtn">Anterior</button>
        <span class="pagination-page" id="paginationPage"></span>
        <button type="button" class="btn-admin btn-admin-outline" id="nextPageBtn">Seguinte</button>
      </div>
    </div>
  </div>
</main>
